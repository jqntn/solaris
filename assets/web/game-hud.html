<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="ui.css">
    <style>
      body {
        pointer-events: none;
      }

      .hud-root {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: var(--space-4);
      }

      .hud-bar {
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-4);
        padding: 0 var(--space-4);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: rgba(7, 11, 16, 0.68);
        box-shadow: 0 14px 34px var(--shadow);
      }

      .hud-brand {
        display: flex;
        align-items: center;
        gap: var(--space-3);
      }

      .hud-title {
        margin: 0;
        color: var(--ink-high);
        font-family: var(--font-title);
        font-size: 1.1rem;
        font-weight: 600;
      }

      .hud-actions {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        pointer-events: auto;
      }

      .hud-actions button {
        min-width: 116px;
        padding: 0 var(--space-4);
        border-color: rgba(163, 197, 214, 0.16);
        background: rgba(255, 255, 255, 0.035);
        color: var(--ink-high);
        font-weight: 600;
      }

      .hud-actions button:hover,
      .hud-actions button:focus {
        border-color: var(--line-strong);
        color: var(--ink-high);
      }

      .hud-actions button:active {
        color: var(--ink-high);
      }

      .hud-footer {
        justify-self: end;
        max-width: 360px;
        padding: var(--space-3) var(--space-4);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: rgba(7, 11, 16, 0.62);
        color: var(--ink-muted);
        font-size: 0.9rem;
        box-shadow: 0 14px 34px var(--shadow);
      }
    </style>
  </head>
  <body>
    <main class="hud-root">
      <header class="hud-bar">
        <div class="hud-brand">
          <h1 class="hud-title">SOLARIS</h1>
          <span class="status-pill" data-tone="ready">Prototype scene</span>
        </div>
        <div class="hud-actions">
          <button id="mainMenuButton" type="button">Main Menu</button>
          <button id="quitButton" class="primary-action" type="button">Quit</button>
        </div>
      </header>
      <div></div>
      <footer class="hud-footer">Dashboard UI placeholder: current build renders the prototype 3D scene.</footer>
    </main>
    <script src="ui.js"></script>
    <script>
      function sendNative(command, payload = "") {
        if (typeof window.solarisNativeCommand === "function") {
          window.solarisNativeCommand(command, String(payload));
        }
      }

      document.getElementById("mainMenuButton").addEventListener("click", () => {
        sendNative("main_menu");
      });

      document.getElementById("quitButton").addEventListener("click", () => {
        sendNative("quit");
      });

      function activateButton(button) {
        if (button.id === "mainMenuButton") {
          sendNative("main_menu");
        } else if (button.id === "quitButton") {
          sendNative("quit");
        }
      }

      window.solarisUi.installButtonConfirmKeys({
        activate: activateButton
      });
    </script>
  </body>
</html>
